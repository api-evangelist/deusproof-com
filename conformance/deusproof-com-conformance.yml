summary: >-
  DEUSPROOF's conformance profile is the agent-protocol stack plus the provenance/timestamping standards
  of its own market, and — unusually — most of it is observable in the CONTENT of live responses rather
  than claimed on a page: a certificate returned by GET /api/verify/{id} carries an RFC 3161 TSA source
  and verification flag, an Ed25519 did:key issuer, a detached manifest in the C2PA 2.x assertion
  vocabulary (self-described as "not a trust-listed C2PA credential"), IPTC digitalSourceType URIs and
  OpenTimestamps anchor calendars. The agent card is A2A 1.0-shaped and signed (JWS EdDSA); the MCP server
  speaks 2025-06-18; the well-known surface adds an Agentic Resource Discovery catalog and an x402 v1
  discovery document. There is no OAuth/OIDC, no RFC 9116 security.txt, no RFC 9727 api-catalog, no
  OpenAPI, and the provider states in its own words that "nothing here is compliance" — no certification or
  regulatory conformance is claimed, so no Compliance pointer is emitted.
