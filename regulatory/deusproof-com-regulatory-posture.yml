summary: >-
  A two-person-scale service with plain-language legal pages ("Written in plain language by the people who
  run the service ... It has not yet been reviewed by a lawyer"). Two horizontal signals carry substance: a
  documented removal/correction channel with a stated scope of what can and cannot be removed, and a named
  list of the third parties that receive data. The site cites the EU AI Act and a US executive order as
  the PROBLEM it addresses and disclaims any compliance claim in the same breath, so no AI-regime
  conformance is recorded. No accessibility statement, SBOM, transparency report (the /numbers page is
  register statistics, not a DSA-style report), data-residency statement, support-lifetime commitment or
  age-assurance mechanism was found; the privacy page says only that the service "is not directed at
  children". Not probed for GPC because the regime rule forbids inferring it from a header.
