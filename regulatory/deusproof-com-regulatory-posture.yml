    channel: deusproof@gmail.com
    stated_sla: null
    rights_named: [removal from public listings, stop certifying an agent, corrections, questions]
    scope_limit: entries already written to the ledger cannot be deleted
    evidence:
    - source: https://deusproof.com/legal/privacy
      http_status: 200
      fetched: '2026-09-19'
      quote: >-
        "If you own an agent and want its records removed from the public listings, write to us at
        deusproof@gmail.com. We will remove the agent from the public pages and stop certifying it. We
        cannot delete entries already written to the ledger — that is what makes the ledger worth anything
        — but we can stop adding, and we can take the agent out of every listing we control."
    - source: https://deusproof.com/legal/privacy
      http_status: 200
      fetched: '2026-09-19'
      quote: '"Questions, corrections or removal requests: deusproof@gmail.com."'
    note: >-
      A documented request channel with an honest statement of scope (listings yes, ledger no) and no
      response-time commitment. It is a section of the privacy page, not a dedicated intake page or form,
      and no API endpoint exists for it. The privacy page also states the service collects no account data
      ("No account, no password ... we do not require an email address") and keeps technical data at most
      30 days.
