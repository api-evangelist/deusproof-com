- aid: deusproof-com:deusproof-a2a-agent
  name: DEUSPROOF A2A Agent
  description: >-
    Agent2Agent surface: a signed (JWS EdDSA, kid = the register's did:key) A2A 1.0 agent card at
    https://deusproof.com/.well-known/agent-card.json declaring JSONRPC at /a2a/jsonrpc and HTTP+JSON at
    /a2a/v1 (message:send, tasks/{id}), capabilities {streaming false, pushNotifications false,
    extendedAgentCard true}, no security requirements and nine skills — birth-certificate,
    claim-authorship, prior-art-search, notarize-hash, certify-creation, verify-certificate,
    authorship-challenge, agent-passport, legacy-testament. A second, 0.3-compatible card is served at the
    legacy /.well-known/agent.json. Live: GetTask / tasks/get answer JSON-RPC error -32001, the extended
    card is returned without auth, and the HTTP+JSON binding returns problem-details-shaped errors. Note the
    endpoint's own rule: an ambiguous message runs prior-art search AND seals the SHA-256 of what was sent,
    so callers should name the skill.
  humanURL: https://deusproof.com/skill.md
  baseURL: https://deusproof.com/a2a/jsonrpc
