- aid: deusproof-com:deusproof-mcp-server
  name: DEUSPROOF MCP Server
  description: >-
    Remote Model Context Protocol server at https://deusproof.com/mcp (Streamable HTTP, JSON-RPC 2.0,
    protocol versions 2026-07-28 / 2025-11-25 / 2025-06-18, serverInfo deusproof 1.0.0 "DEUSPROOF Notary").
    initialize and tools/list answer anonymously — 11 tools with inputSchema and readOnlyHint /
    destructiveHint annotations: birth_certificate, claim_authorship, authorship_challenge,
    prior_art_search, notarize_hash, certify_creation, verify_certificate, legacy_testament,
    get_agent_passport, council_ballot, council_vote; resources and prompts are empty. The same server ships
    as a local stdio package (PyPI deusproof-mcp 0.3.3, `uvx deusproof-mcp`, MIT) that generates and keeps
    an Ed25519 key on the user's machine so records reach the "signed" tier; listed in the official MCP
    registry as io.github.Abracadabrastartup/deusproof-mcp with the remote URL declared. A server card is
    served at /.well-known/mcp/server-card.json and the ARD catalog points at it. The Claude Code plugin
    connects to the hosted URL.
