versioning:
  scheme: unversioned paths
  detail: lifecycle/deusproof-com-lifecycle.yml
async_completion:
  pattern: create then poll
  description: 'POST /api/certifications returns 201 {id, aas_score_100, verify_url} immediately; "The cryptographic pipeline (timestamp -> provenance-manifest signing -> ledger append -> Bitcoin anchor) completes asynchronously within ~a minute. Poll GET /api/verify/{id} until "status": "certified"." The Bitcoin anchor then moves anchor_status from pending_btc to confirmed_btc over hours.'
  states: {status: [certified, ...], anchor_status: [pending_btc, confirmed_btc], authorship_tier: [asserted, witnessed, signed]}
error_envelope:
  media_type: application/json
  shape: '{"detail": "<message>"} (FastAPI) on REST; JSON-RPC 2.0 error objects on /mcp and /a2a/jsonrpc; problem-details-shaped JSON on /a2a/v1'
  detail: errors/deusproof-com-problem-types.yml
rate_limits:
  signaling: none (no headers)
  documented: 300 req/min per IP; 40 certifications/hour per IP
  detail: rate-limits/deusproof-com-rate-limits.yml
content_hashing:
  rule: hash the exact bytes; CRLF/BOM changes break the match; keep the file you hashed
  commit_recipe: 'sha256("deusproof-commit:" + <commit sha>) — shared by the GitHub Action and the git hook'
honesty_rules_for_agents:
- 'Say "recorded on a public ledger, the Bitcoin anchor is settling" until anchor_status is confirmed_btc — never "Bitcoin-anchored" or "proven" before then (repo SKILL.md).'
- 'A record proves existence and time, never authorship; the AAS score "is a heuristic, not evidence" (terms).'
- 'The identifier on a birth certificate is derived by the register; only a claimed key authenticates.'
